<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131b"><title>Бездна — пошаговая RPG · прототип</title>
<style>
:root{--cyan:#68d5db;--gold:#c9a875;--ink:#06131b;--panel:#0a1924;--line:#365362;--red:#d36c75}*{box-sizing:border-box}body{margin:0;background:#030a10;color:#dce8e9;font-family:system-ui,-apple-system,Arial,sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#app{width:min(100%,480px);min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#081d29,#06111b 70%);box-shadow:0 0 80px #000}header{height:82px;padding:19px 18px 12px;display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #3d657044;background:linear-gradient(#091d29,#071722)}.eyebrow{font-size:10px;letter-spacing:2.6px;color:#79b4bb;font-weight:700}h1{font-family:Georgia,serif;font-weight:400;font-size:25px;margin:4px 0 0;color:#ecf2e7}.round{font-size:12px;color:#d5bb87;border:1px solid #756547;padding:9px 12px;border-radius:4px}.initiative{display:flex;align-items:center;gap:7px;padding:11px 14px;background:#06121a;border-bottom:1px solid #23414b;overflow:hidden}.init-label{font-size:9px;letter-spacing:1.5px;color:#759aa2;margin-right:3px}.turn{height:39px;min-width:39px;display:grid;place-items:center;border:1px solid #34515a;background:#102630;border-radius:6px;font-size:20px;position:relative;opacity:.65}.turn.active{opacity:1;border-color:var(--cyan);box-shadow:0 0 13px #3dc9d65a}.turn.enemy{color:#d58a91}.battle{height:clamp(300px,43dvh,480px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 53% 18%,#2a79858c,transparent 42%),linear-gradient(180deg,#0a3040 0%,#0b2836 45%,#06141d 100%)}.battle:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 52px,#8ec5c008 53px 55px,transparent 56px 90px);opacity:.5}.ruins{position:absolute;inset:0;pointer-events:none}.ruins svg{width:100%;height:100%}.ground{position:absolute;bottom:0;width:100%;height:30%;background:linear-gradient(0deg,#071017,#153743a0 65%,transparent);clip-path:polygon(0 35%,17% 20%,45% 31%,70% 17%,100% 30%,100% 100%,0 100%)}.bubbles{position:absolute;inset:0;background-image:radial-gradient(circle,#94d9d54d 1px,transparent 2px);background-size:38px 63px;opacity:.3;pointer-events:none}.team{position:absolute;bottom:14%;left:3%;width:58%;display:flex;align-items:end;justify-content:space-between;gap:0}.foes{position:absolute;bottom:16%;right:3%;width:39%;display:flex;align-items:end;justify-content:space-around;gap:3px}.unit{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;transition:transform .2s,filter .2s;user-select:none}.unit.active .figure{filter:drop-shadow(0 0 9px #63e4e8)}.unit.target .figure{filter:drop-shadow(0 0 10px #fa7777)}.unit.dead{opacity:.25;filter:grayscale(1)}.figure{height:clamp(112px,19dvh,175px);width:100%;display:flex;align-items:end;justify-content:center;filter:drop-shadow(0 9px 6px #0009)}.figure svg{height:100%;width:100%;overflow:visible}.foes .figure{height:clamp(100px,17dvh,150px)}.unit-name{font-size:10px;white-space:nowrap;text-shadow:0 2px 4px #000;font-weight:700}.hp{height:5px;background:#351b23;border:1px solid #080f16;border-radius:8px;width:90%;margin-top:4px;overflow:hidden}.hp>i{display:block;background:linear-gradient(90deg,#8f394d,#e17e82);height:100%;transition:width .3s}.team .hp>i{background:linear-gradient(90deg,#1b8b86,#70d8bc)}.numbers{font-size:9px;color:#c1d7d6;margin-top:2px}.unit.enemy-unit{cursor:pointer}.unit.enemy-unit.target:after{content:"◆";position:absolute;top:-14px;color:#ff8b87;font-size:14px}.hit{animation:hit .38s ease}@keyframes hit{0%,100%{transform:translateX(0)}35%{transform:translateX(9px);filter:brightness(2)}70%{transform:translateX(-5px)}}.status{position:absolute;left:12px;right:12px;bottom:6px;font-size:11px;color:#a4c7ca;text-align:center;text-shadow:0 2px 4px #000}.control{padding:16px 15px 24px;background:linear-gradient(180deg,#0c1b25,#06121b);border-top:1px solid #48758266}.hero-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hero-info h2{font-family:Georgia,serif;font-size:21px;font-weight:400;margin:0}.hero-info small{color:#8bb4bb;font-size:11px}.hero-info .stats{font-size:12px;color:#91c5ca;text-align:right}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.action{min-height:77px;background:linear-gradient(145deg,#112b35,#0b1c27);border:1px solid #3c5b63;border-radius:7px;color:#e0e8e6;display:flex;align-items:center;gap:11px;text-align:left;padding:11px}.action strong{display:block;font-size:13px}.action small{display:block;color:#82a7af;font-size:10px;margin-top:4px}.action .ico{font-size:26px}.action.selected{border-color:#7bd6d8;box-shadow:inset 0 0 0 1px #5abdc2,0 0 13px #3dcbcf2c}.action:disabled{opacity:.35;cursor:default}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.log{font-size:11px;color:#8eafb7;line-height:1.4;flex:1;min-height:35px}.confirm{padding:13px 18px;background:#267c84;border:1px solid #74cbd0;color:#effffe;border-radius:6px;font-weight:700;font-size:12px;min-width:122px}.confirm:disabled{opacity:.35}.end{position:absolute;inset:0;background:#041019eb;display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.end.show{display:flex}.end h2{font:38px Georgia,serif;color:#e8d2a5}.end p{color:#aac1c5}.end button{background:#236c75;border:1px solid #80d6d7;border-radius:5px;color:white;padding:14px 28px;margin-top:20px}.foot{font-size:10px;color:#527982;text-align:center;padding:10px}.floating{position:absolute;z-index:6;color:#fff;font-size:24px;font-weight:900;pointer-events:none;text-shadow:0 2px 8px #000;animation:float .75s ease-out forwards}@keyframes float{to{transform:translateY(-52px);opacity:0}}@media(max-height:700px){header{height:65px;padding-top:12px}.battle{height:38dvh}.figure{height:95px!important}.control{padding-top:10px}.action{min-height:60px}}
</style></head><body><main id="app"><header><div><div class="eyebrow">ГЛУБИНЫ · ПРОТОТИП 0.1</div><h1>Затопленный храм</h1></div><div class="round" id="round">Раунд 1</div></header><div class="initiative"><span class="init-label">ХОДЫ</span><div id="queue" style="display:flex;gap:6px"></div></div><section class="battle" id="battle"><div class="ruins"><svg viewBox="0 0 400 450" preserveAspectRatio="none"><defs><linearGradient id="col" x2="1" y2="0"><stop stop-color="#071720"/><stop offset=".5" stop-color="#1a4855"/><stop offset="1" stop-color="#061822"/></linearGradient></defs><path d="M0 60L400 20V95L0 110Z" fill="#071b26" opacity=".8"/><g fill="url(#col)" opacity=".7"><path d="M20 60h42v320H20zM8 45h65v30H8zM330 40h45v350h-45zM317 24h72v32h-72zM180 125h29v255h-29zM173 115h43v18h-43z"/></g><path d="M0 380L80 320 140 350 230 308 315 338 400 290V450H0Z" fill="#071823" opacity=".55"/><path d="M0 400Q80 365 180 395T400 375" fill="none" stroke="#3b8589" opacity=".35" stroke-width="4"/><g stroke="#3b9f9c" opacity=".5" fill="none"><path d="M10 440q20-60 8-95m4 77q32-25 23-70M380 440q-20-70-4-105m-3 75q-29-24-20-65"/></g></svg></div><div class="bubbles"></div><div class="ground"></div><div class="team" id="team"></div><div class="foes" id="foes"></div><div class="status" id="status">Выберите действие и цель</div></section><section class="control"><div class="hero-info"><div><h2 id="heroTitle">Глубинщик</h2><small id="heroRole">Тяжёлый боец</small></div><div class="stats" id="heroStats">Здоровье 120 / 120<br>Энергия 40 / 40</div></div><div class="actions" id="actions"></div><div class="bottom"><div class="log" id="log">Начинается бой. Глубины не прощают ошибок.</div><button class="confirm" id="confirm" disabled>Выберите цель</button></div></section><div class="foot">Игровой прототип · без 3D · вертикальный экран</div><div class="end" id="end"><div style="font-size:55px" id="endIcon">⚔️</div><h2 id="endTitle">Победа</h2><p id="endText"></p><button onclick="location.reload()">Новый бой</button></div></main>
<script>
const icons=['🛡️','🔮','🗡️','🐟','🦀'];
const heroDefs=[{name:'Глубинщик',role:'Тяжёлый боец',hp:120,en:40,init:8,atk:19,cost:15,skill:'Сокрушающий удар',bonus:33,shape:0},{name:'Поглотитель',role:'Маг глубин',hp:85,en:70,init:12,atk:13,cost:20,skill:'Разряд бездны',bonus:28,shape:1},{name:'Острый риф',role:'Убийца',hp:95,en:50,init:18,atk:17,cost:15,skill:'Кровавый риф',bonus:31,shape:2}];
const enemyDefs=[{name:'Морской хищник',hp:90,init:15,atk:13,shape:3},{name:'Рифовый страж',hp:75,init:6,atk:11,shape:4}];
const units=[...heroDefs.map((u,i)=>({...u,id:i,max:u.hp,maxEn:u.en,enemy:false,alive:true})),...enemyDefs.map((u,i)=>({...u,id:i+3,max:u.hp,enemy:true,alive:true}))];
let order=[],turnIndex=0,round=1,selectedAction=null,targetId=null,busy=false,finished=false;
const $=id=>document.getElementById(id);
function figure(id){const colors=[['#456f76','#6cc4bd'],['#4e508b','#8fd8e7'],['#395e68','#9ac5d0'],['#405b63','#e0b96c'],['#64425b','#c786a5']];let [base,light]=colors[id];const weapon=id===0?'<path d="M67 37L78 96" stroke="#9bc2c4" stroke-width="5"/><path d="M58 32L81 23 90 47 68 54Z" fill="#829e9f" stroke="#d6c3a1" stroke-width="3"/>':id===1?'<path d="M73 20L76 100" stroke="#a8c8d6" stroke-width="4"/><circle cx="73" cy="18" r="12" fill="#58d8f5" opacity=".8"/>':id===2?'<path d="M69 69L87 28" stroke="#d1e5e3" stroke-width="4"/>':'';return '<svg viewBox="0 0 100 140" aria-hidden="true"><ellipse cx="49" cy="132" rx="39" ry="7" fill="#02080d" opacity=".7"/><path d="M25 82L19 127 38 129 45 95 52 128 72 127 65 79" fill="'+base+'" stroke="#0b2630" stroke-width="4"/><path d="M21 46Q48 24 75 46L72 91Q49 105 23 91Z" fill="'+base+'" stroke="'+light+'" stroke-width="3"/><path d="M24 47L7 65 14 89 31 80M72 46L89 64 84 90 68 80" fill="'+base+'" stroke="'+light+'" stroke-width="4"/><path d="M30 26L19 7 40 17 50 4 61 18 80 9 69 33 73 51Q50 65 27 49Z" fill="'+base+'" stroke="'+light+'" stroke-width="3"/><path d="M31 41Q50 30 69 41L64 52 36 52Z" fill="#081a25"/><circle cx="40" cy="43" r="4" fill="'+light+'"/><circle cx="60" cy="43" r="4" fill="'+light+'"/><path d="M35 70L50 79 65 70" fill="none" stroke="'+light+'" stroke-width="3" opacity=".8"/>'+weapon+'</svg>'}
function render(){const active=order[turnIndex];$('round').textContent='Раунд '+round;$('queue').innerHTML=order.slice(turnIndex).filter(id=>units[id].alive).concat(order.slice(0,turnIndex).filter(id=>units[id].alive)).map((id,i)=>'<div class="turn '+(i===0?'active ':'')+(units[id].enemy?'enemy':'')+'">'+icons[id]+'</div>').join('');
for(const [container,ids] of [['team',[0,1,2]],['foes',[3,4]]]){$(container).innerHTML=ids.map(id=>{const u=units[id];return '<div class="unit '+(!u.alive?'dead ':'')+(id===active?'active ':'')+(id===targetId?'target ':'')+(u.enemy?'enemy-unit':'')+'" data-id="'+id+'"><div class="figure">'+figure(u.shape)+'</div><div class="unit-name">'+u.name+'</div><div class="hp"><i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i></div><div class="numbers">'+Math.max(0,u.hp)+' / '+u.max+'</div></div>'}).join('')}
document.querySelectorAll('.enemy-unit').forEach(el=>el.onclick=()=>{if(!busy&&active!==undefined&&!units[active].enemy&&units[+el.dataset.id].alive){targetId=+el.dataset.id;render()}});
if(active===undefined)return;const h=units[active];$('heroTitle').textContent=h.enemy?'Ход противника':h.name;$('heroRole').textContent=h.enemy?'Враг выбирает действие':h.role;$('heroStats').innerHTML=h.enemy?'Вражеская атака':'Здоровье '+h.hp+' / '+h.max+'<br>Энергия '+h.en+' / '+h.maxEn;
const actions=[{name:'Атака',desc:'Обычный удар',ico:'⚔️',cost:0},{name:h.enemy?'Способность':h.skill,desc:'Расход: '+(h.cost||0)+' энергии',ico:'✦',cost:h.cost||0},{name:'Защита',desc:'Снижает следующий урон',ico:'🛡️',cost:0},{name:'Передышка',desc:'Восстановить 15 энергии',ico:'💧',cost:0}];
$('actions').innerHTML=actions.map((a,i)=>'<button class="action '+(selectedAction===i?'selected':'')+'" data-action="'+i+'" '+(busy||h.enemy||i===1&&h.en<a.cost?'disabled':'')+'><span class="ico">'+a.ico+'</span><span><strong>'+a.name+'</strong><small>'+a.desc+'</small></span></button>').join('');
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{selectedAction=+b.dataset.action;if(selectedAction>=2)targetId=null;render()});
const can=!busy&&!h.enemy&&selectedAction!==null&&(selectedAction>=2||targetId!==null&&units[targetId].alive);$('confirm').disabled=!can;$('confirm').textContent=selectedAction>=2?'Выполнить':targetId!==null?'Атаковать':'Выберите цель';$('status').textContent=h.enemy?'Противник готовится к атаке':selectedAction===null?'Выберите действие':selectedAction<2?'Нажмите на живого противника':'Подтвердите действие';
}
function say(s){$('log').textContent=s}
function pop(id,n){const el=document.querySelector('[data-id="'+id+'"]');if(!el)return;el.classList.add('hit');const b=el.getBoundingClientRect(),p=$('battle').getBoundingClientRect();const d=document.createElement('div');d.className='floating';d.textContent=n;d.style.left=(b.left-p.left+b.width/2-10)+'px';d.style.top=(b.top-p.top+10)+'px';$('battle').appendChild(d);setTimeout(()=>d.remove(),780)}
function damage(target,amount){const u=units[target];let actual=Math.max(1,amount-(u.guard?Math.ceil(amount*.55):0));u.guard=false;u.hp=Math.max(0,u.hp-actual);u.alive=u.hp>0;pop(target,'−'+actual)}
function next(){selectedAction=null;targetId=null;if(units.slice(3).every(u=>!u.alive))return end(true);if(units.slice(0,3).every(u=>!u.alive))return end(false);do{turnIndex++;if(turnIndex>=order.length){round++;turnIndex=0;order=units.filter(u=>u.alive).sort((a,b)=>b.init-a.init).map(u=>u.id)}}while(!units[order[turnIndex]].alive);busy=false;render();if(units[order[turnIndex]].enemy){busy=true;setTimeout(enemyTurn,850)}}
function enemyTurn(){if(finished)return;const e=units[order[turnIndex]];const possible=units.slice(0,3).filter(u=>u.alive);if(!possible.length)return end(false);const t=possible[Math.floor(Math.random()*possible.length)];damage(t.id,e.atk+Math.floor(Math.random()*6));say(e.name+' атакует: '+t.name);render();setTimeout(next,850)}
function end(win){finished=true;$('end').classList.add('show');$('endIcon').textContent=win?'🏆':'☠️';$('endTitle').textContent=win?'Победа':'Отряд погиб';$('endText').textContent=win?'Враги повержены. Подводный храм пока хранит свои тайны.':'Глубины оказались сильнее. Попробуйте другую тактику.'}
$('confirm').onclick=()=>{if(busy||selectedAction===null||finished)return;const h=units[order[turnIndex]];busy=true;let msg='';if(selectedAction===0){damage(targetId,h.atk+Math.floor(Math.random()*7));msg=h.name+' наносит обычный удар'}else if(selectedAction===1){h.en-=h.cost;damage(targetId,h.bonus+Math.floor(Math.random()*9));msg=h.name+' применяет «'+h.skill+'»'}else if(selectedAction===2){h.guard=true;msg=h.name+' укрепляет защиту'}else{h.en=Math.min(h.maxEn,h.en+15);msg=h.name+' восстанавливает энергию'}say(msg);render();setTimeout(next,750)};
function start(){order=units.slice().sort((a,b)=>b.init-a.init).map(u=>u.id);render();if(units[order[0]].enemy){busy=true;setTimeout(enemyTurn,850)}}
start();
</script></body></html>
